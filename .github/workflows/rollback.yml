name: Rollback

# Manual rollback of an environment to the previous commit (or a specific SHA).
# Since deploy is "git reset --hard origin/<branch>", rollback is the same reset
# but to an older commit — nothing needs to be re-uploaded.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to roll back"
        required: true
        type: choice
        options:
          - staging
          - production
      commit:
        description: "Commit SHA (empty = roll back to HEAD~1)"
        required: false
        default: ""

jobs:
  rollback-staging:
    name: Rollback staging
    if: github.event.inputs.target == 'staging'
    runs-on: ubuntu-22.04
    env:
      APP_PATH: /srv/app-staging
    steps:
      - name: Rollback staging via SSH
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USERNAME: ${{ secrets.STAGING_SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOCK_SEQUENCE: ${{ secrets.KNOCK_SEQUENCE }}
          TARGET_COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_PORT SSH_USERNAME SSH_PRIVATE_KEY; do
            [ -z "${!v:-}" ] && { echo "::error::Missing secret $v"; exit 1; }
          done
          KEYFILE=$(mktemp); REMOTE=$(mktemp)
          trap 'rm -f "$KEYFILE" "$REMOTE"' EXIT
          echo "$SSH_PRIVATE_KEY" > "$KEYFILE"; chmod 600 "$KEYFILE"
          read -r -a KNOCK_PORTS <<< "${KNOCK_SEQUENCE:-}"
          sudo apt-get update -qq && sudo apt-get install -y -qq knockd

          cat > "$REMOTE" <<'EOS'
          set -e
          TARGET="${1:-HEAD~1}"
          cd "$APP_PATH" || exit 1
          git fetch origin
          echo "Rollback to: $TARGET"
          git reset --hard "$TARGET"
          rm -rf runtime/cache/* runtime/HTML/* web/assets/* 2>/dev/null || true
          echo "ROLLBACK OK: $(git rev-parse --short HEAD)"
          EOS

          OK=0
          for attempt in 1 2 3; do
            knock "$SSH_HOST" "${KNOCK_PORTS[@]}" || true
            sleep 2
            set +e
            ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -i "$KEYFILE" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
              "APP_PATH='$APP_PATH' bash -s" "${TARGET_COMMIT:-}" < "$REMOTE"
            RC=$?
            set -e
            [ "$RC" -eq 0 ] && { OK=1; break; }
            [ "$RC" -ne 255 ] && { echo "::error::Remote script exited with code $RC"; exit "$RC"; }
            sleep 5
          done
          [ "$OK" -eq 1 ] || { echo "::error::Could not connect after 3 attempts"; exit 1; }

  rollback-production:
    name: Rollback production
    if: github.event.inputs.target == 'production'
    runs-on: ubuntu-22.04
    env:
      APP_PATH: /srv/app
    steps:
      - name: Rollback production via SSH
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USERNAME: ${{ secrets.PROD_SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOCK_SEQUENCE: ${{ secrets.KNOCK_SEQUENCE }}
          TARGET_COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_PORT SSH_USERNAME SSH_PRIVATE_KEY; do
            [ -z "${!v:-}" ] && { echo "::error::Missing secret $v"; exit 1; }
          done
          KEYFILE=$(mktemp); REMOTE=$(mktemp)
          trap 'rm -f "$KEYFILE" "$REMOTE"' EXIT
          echo "$SSH_PRIVATE_KEY" > "$KEYFILE"; chmod 600 "$KEYFILE"
          read -r -a KNOCK_PORTS <<< "${KNOCK_SEQUENCE:-}"
          sudo apt-get update -qq && sudo apt-get install -y -qq knockd

          cat > "$REMOTE" <<'EOS'
          set -e
          TARGET="${1:-HEAD~1}"
          cd "$APP_PATH" || exit 1
          git fetch origin
          echo "Rollback to: $TARGET"
          git reset --hard "$TARGET"
          rm -rf runtime/cache/* runtime/HTML/* web/assets/* 2>/dev/null || true
          echo "ROLLBACK OK: $(git rev-parse --short HEAD)"
          EOS

          OK=0
          for attempt in 1 2 3; do
            knock "$SSH_HOST" "${KNOCK_PORTS[@]}" || true
            sleep 2
            set +e
            ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 -i "$KEYFILE" -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
              "APP_PATH='$APP_PATH' bash -s" "${TARGET_COMMIT:-}" < "$REMOTE"
            RC=$?
            set -e
            [ "$RC" -eq 0 ] && { OK=1; break; }
            [ "$RC" -ne 255 ] && { echo "::error::Remote script exited with code $RC"; exit "$RC"; }
            sleep 5
          done
          [ "$OK" -eq 1 ] || { echo "::error::Could not connect after 3 attempts"; exit 1; }
